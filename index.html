<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise for Chinku ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Pacifico&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff6e8;
  --paper:#f7dfb6;
  --rose:#d85f7a;
  --deep-rose:#a9405b;
  --wine:#663440;
  --brown:#875a50;
  --shadow:rgba(83,41,46,.22);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow:hidden}
body{
  min-height:100vh; display:grid; place-items:center;
  font-family:"Playfair Display",serif; color:var(--wine);
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.45) 0 1px,transparent 2px) 0 0/27px 27px,
    linear-gradient(135deg,#eab9af 0%,#f5d8b5 48%,#e6a4a3 100%);
}
body:after{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.13;
  background:repeating-linear-gradient(0deg,rgba(79,41,37,.16) 0 1px,transparent 1px 4px);
}
.scene{
  position:relative; width:min(94vw,850px); height:min(86vh,680px);
  display:grid; place-items:center; perspective:1600px;
}

/* ENVELOPE */
.envelope-wrap{
  position:absolute; width:min(88vw,670px); aspect-ratio:1.65/1;
  cursor:pointer; z-index:5; filter:drop-shadow(0 28px 24px rgba(78,37,42,.22));
  transition:opacity .6s ease, transform .6s ease;
}
.envelope{
  position:absolute; inset:0; overflow:hidden;
  background:#f1c58e; border:3px solid var(--brown);
  box-shadow:7px 8px 0 rgba(104,58,48,.22);
}
.envelope::before,.envelope::after{
  content:""; position:absolute; top:0; width:57%; height:100%; z-index:4;
  background:linear-gradient(145deg,#f9d9a7,#efbc86);
}
.envelope::before{left:-1px;clip-path:polygon(0 0,100% 50%,0 100%);border-right:1px solid rgba(96,58,48,.28)}
.envelope::after{right:-1px;clip-path:polygon(100% 0,0 50%,100% 100%);border-left:1px solid rgba(96,58,48,.28)}
.flap{
  position:absolute; z-index:7; left:-3px; top:-3px;
  width:calc(100% + 6px); height:59%;
  transform-origin:top center;
  background:linear-gradient(145deg,#f9d9a7,#e9ad77);
  clip-path:polygon(0 0,100% 0,50% 100%);
  border-bottom:3px solid var(--brown);
  transition:transform 1s cubic-bezier(.2,.8,.2,1);
}
.letter-preview{
  position:absolute; z-index:2; left:10%; bottom:6%; width:80%; height:87%;
  padding:34px 20px; text-align:center; background:var(--cream);
  border:2px solid #d9a66c;
  transition:transform 1.05s cubic-bezier(.2,.8,.2,1);
}
.preview-top{
  font-family:"DM Mono",monospace; font-size:.65rem; letter-spacing:2px;
  text-transform:uppercase; color:var(--brown);
}
.letter-preview h1{
  margin:12px 0 0; font-family:"Pacifico",cursive; font-weight:400;
  color:var(--rose); font-size:clamp(2.1rem,7vw,4.7rem);
}
.seal{
  position:absolute; z-index:10; left:50%; top:51%; transform:translate(-50%,-50%);
  width:78px; height:78px; border-radius:50%; display:grid; place-items:center;
  background:var(--deep-rose); color:var(--cream); font-size:30px;
  border:3px solid var(--cream); box-shadow:3px 4px 0 var(--brown);
  transition:opacity .35s ease, transform .35s ease;
}
.open-text{
  position:absolute; z-index:12; left:50%; bottom:-52px; transform:translateX(-50%);
  white-space:nowrap; font-family:"DM Mono",monospace; font-size:.75rem;
  letter-spacing:1.4px; color:var(--wine); animation:bob 1.8s ease-in-out infinite;
}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}

/* ONE CLICK OPEN */
.opening .flap{transform:rotateX(180deg)}
.opening .letter-preview{transform:translateY(-135%) scale(1.04)}
.opening .seal,.opening .open-text{opacity:0;transform:translate(-50%,-50%) scale(.85)}
.revealed .envelope-wrap{opacity:0;transform:scale(.88);pointer-events:none}

/* REVEALED CARD */
.surprise{
  position:absolute; inset:0; display:grid; place-items:center;
  opacity:0; pointer-events:none; transform:translateY(12px);
  transition:opacity .65s ease, transform .65s ease;
}
.revealed .surprise{opacity:1;transform:none;pointer-events:auto}
.card{
  position:relative; width:min(94vw,770px);
  padding:52px 32px 44px; text-align:center;
  background:var(--cream); border:8px solid #f1c487;
  box-shadow:10px 11px 0 rgba(119,66,54,.25),0 25px 60px var(--shadow);
}
.card::before,.card::after{
  position:absolute; color:var(--rose); font-family:Arial,sans-serif;
  font-size:46px; line-height:1; content:"♡";
}
.card::before{top:13px;left:18px;transform:rotate(-14deg)}
.card::after{right:18px;bottom:12px;transform:rotate(14deg)}
.card-inner{
  padding:22px 14px 12px;
  border:1px dashed rgba(135,90,80,.42);
}
.kicker{
  font-family:"DM Mono",monospace; font-size:.67rem; letter-spacing:3px;
  text-transform:uppercase; color:var(--brown);
}
.card h2{
  margin:8px 0 5px; font-family:"Pacifico",cursive; font-weight:400;
  color:var(--deep-rose); font-size:clamp(2.8rem,9vw,5.4rem);
  text-shadow:2px 3px 0 #f2b9ab;
}
.subtitle{margin:0 auto 30px;font-size:1rem;font-style:italic}
.counter{
  display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
  max-width:650px; margin:auto;
}
.unit{
  position:relative; padding:20px 8px 15px; overflow:hidden;
  background:#f8d7a8; border:2px solid var(--brown);
  box-shadow:4px 5px 0 var(--brown);
}
.unit::before{
  content:""; position:absolute; inset:6px; border:1px dashed rgba(135,90,80,.45);
}
.number{
  position:relative; display:block; font-family:"DM Mono",monospace;
  font-size:clamp(1.65rem,5.8vw,3.5rem); font-weight:bold; color:var(--deep-rose);
}
.label{
  position:relative; display:block; margin-top:7px; font-family:"DM Mono",monospace;
  font-size:.6rem; letter-spacing:1px; text-transform:uppercase;
}
.note{
  margin:30px 0 0; font-family:"Pacifico",cursive; font-size:1.2rem;
  color:var(--deep-rose);
}
.hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:20}
.heart{
  position:absolute;bottom:-70px;color:var(--rose);opacity:.5;
  animation:float linear infinite;
}
@keyframes float{
  0%{transform:translateY(0) rotate(0deg);opacity:0}
  10%,90%{opacity:.55}
  100%{transform:translateY(-118vh) rotate(28deg);opacity:0}
}
@media(max-width:600px){
  .scene{height:82vh}
  .card{padding:44px 14px 34px;border-width:7px}
  .card-inner{padding:20px 8px 10px}
  .counter{grid-template-columns:repeat(2,1fr);gap:14px}
  .letter-preview{padding-top:24px}
  .seal{width:66px;height:66px}
}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>

<main class="scene" id="scene">
  <div class="envelope-wrap" id="envelope" role="button" aria-label="Open your surprise">
    <div class="envelope">
      <div class="letter-preview">
        <div class="preview-top">A little surprise for</div>
        <h1>Chinku ♡</h1>
      </div>
      <div class="flap"></div>
      <div class="seal">♡</div>
    </div>
    <div class="open-text">open your surprise ♡</div>
  </div>

  <section class="surprise">
    <article class="card">
      <div class="card-inner">
        <div class="kicker">September 4 · a day for you</div>
        <h2>Chinku ♡</h2>
        <p class="subtitle">Every little second brings us closer to your special day.</p>

        <div class="counter" aria-label="Birthday countdown">
          <div class="unit"><span class="number" id="days">00</span><span class="label">Days</span></div>
          <div class="unit"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
          <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
          <div class="unit"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
        </div>

        <p class="note" id="message">Something beautiful is almost here... ♡</p>
      </div>
    </article>
  </section>
</main>

<script>
const scene = document.getElementById("scene");
const envelope = document.getElementById("envelope");

function openSurprise(){
  scene.classList.add("opening");
  setTimeout(() => scene.classList.add("revealed"), 850);
}
envelope.addEventListener("click", openSurprise, { once:true });
envelope.addEventListener("keydown", e => {
  if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openSurprise(); }
}, { once:true });

function getBirthday(){
  const now = new Date();
  let target = new Date(now.getFullYear(), 8, 4, 0, 0, 0);
  if(now >= target) target = new Date(now.getFullYear()+1, 8, 4, 0, 0, 0);
  return target;
}
const target = getBirthday();

function updateCountdown(){
  const diff = target - new Date();
  if(diff <= 0){
    document.querySelector(".counter").style.display = "none";
    document.getElementById("message").textContent = "Happy Birthday, my Chinku! ♡ 🎂";
    return;
  }
  const values = {
    days: Math.floor(diff / 86400000),
    hours: Math.floor(diff / 3600000) % 24,
    minutes: Math.floor(diff / 60000) % 60,
    seconds: Math.floor(diff / 1000) % 60
  };
  for(const [id,value] of Object.entries(values)){
    document.getElementById(id).textContent = String(value).padStart(2,"0");
  }
}
updateCountdown();
setInterval(updateCountdown,1000);

const hearts = document.getElementById("hearts");
for(let i=0;i<18;i++){
  const heart = document.createElement("span");
  heart.className = "heart";
  heart.textContent = i % 3 === 0 ? "♥" : "♡";
  heart.style.left = `${Math.random()*100}vw`;
  heart.style.fontSize = `${14 + Math.random()*24}px`;
  heart.style.animationDuration = `${9 + Math.random()*10}s`;
  heart.style.animationDelay = `${-Math.random()*15}s`;
  hearts.appendChild(heart);
}
</script>
</body>
</html>
